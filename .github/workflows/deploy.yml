name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (a commit SHA, or 'latest'). Use this to roll back."
        required: false
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/senotify/backend-lab
  HOSTNAME: lab.senotify.com

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          t="${{ github.event.inputs.tag }}"
          if [ -n "$t" ] && [ "$t" != "latest" ]; then
            echo "tag=$t" >> "$GITHUB_OUTPUT"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pick.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3
      - if: steps.pick.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.pick.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.build.outputs.tag }}
          DBPASS: ${{ secrets.LAB_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Same pattern as the other senotify apps: vars on the ssh line, script
          # on stdin. The DB is only reachable on the private lab-net network.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$USER@$HOST" \
            IMAGE='${{ env.IMAGE }}' TAG="$TAG" TOKEN="$TOKEN" ACTOR="$ACTOR" DBPASS="$DBPASS" \
            'bash -euo pipefail -s' <<'REMOTE'
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker network inspect lab-net >/dev/null 2>&1 || docker network create lab-net

            # Postgres is long-lived: only create it when missing. The seeded
            # 1M rows live in the lab-pgdata volume and survive app deploys.
            if ! docker inspect lab-postgres >/dev/null 2>&1; then
              docker run -d --name lab-postgres --network lab-net --restart unless-stopped \
                --memory 640m --shm-size 256m \
                -e POSTGRES_PASSWORD="$DBPASS" \
                -v lab-pgdata:/var/lib/postgresql/data \
                postgres:17-alpine \
                postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=20
            fi

            docker pull "$IMAGE:$TAG"
            docker rm -f lab 2>/dev/null || true
            docker create --name lab --network proxy-network --restart unless-stopped \
              --memory 128m \
              -e LAB_DB_PASSWORD="$DBPASS" -e PGHOST=lab-postgres \
              "$IMAGE:$TAG" >/dev/null
            docker network connect lab-net lab
            docker start lab
            docker image prune -f >/dev/null 2>&1 || true
            echo "deployed lab from $IMAGE:$TAG"
          REMOTE

      - name: Verify site is serving
        run: |
          set -euo pipefail
          H='${{ env.HOSTNAME }}'
          for i in $(seq 1 60); do
            s=$(curl -sS -m 15 --resolve "$H:443:${{ secrets.VPS_HOST }}" "https://$H/api/status" || true)
            echo "attempt $i: $s"
            if grep -q '"ready":true' <<<"$s"; then exit 0; fi
            sleep 8   # a fresh seed of 10M rows takes ~2-3 minutes
          done
          echo "lab did not become ready"; exit 1
